@'
name: Lab 13 End-to-End MLOps Pipeline

on:
  push:
    branches:
      - experiment-3

  pull_request:
    branches:
      - experiment-3

  workflow_dispatch:

permissions:
  contents: read

jobs:

  end-to-end-pipeline:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt

      - name: Validate dataset availability
        run: |
          test -f data/processed/cleaned_news.csv
          test -f data/processed/test_data.csv
          echo "Datasets are available."

      - name: Run end-to-end MLOps pipeline
        run: |
          python pipelines/e2e_pipeline.py

      - name: Build Docker image
        run: |
          docker build -t fake-real-news-api:lab13 .

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab13-pipeline-report
          path: artifacts/e2e_pipeline_report.json
          if-no-files-found: warn
