name: Lab 13 End-to-End MLOps Pipeline

on:
  push:
    branches:
      - experiment-3
  pull_request:
    branches:
      - experiment-3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  end-to-end-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install -r requirements-ci.txt

      - name: Verify model artifacts
        run: |
          test -f models/final_svm_model.pkl
          test -f models/tfidf_vectorizer.pkl
          echo "Model artifacts verified."

      - name: Check datasets
        id: dataset
        run: |
          if [ -f data/processed/cleaned_news.csv ] && [ -f data/processed/test_data.csv ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Both datasets are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Training dataset is not available on GitHub. Full training pipeline will be skipped."
          fi

      - name: Run full end-to-end pipeline
        if: steps.dataset.outputs.available == 'true'
        run: python pipelines/e2e_pipeline.py

      - name: Run API tests
        run: python -m pytest tests/test_api.py -v

      - name: Build Docker image
        run: docker build -t fake-real-news-api:lab13 .

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab13-pipeline-report
          path: artifacts/e2e_pipeline_report.json
          if-no-files-found: warn
