
name: Fake Real News Detection - Lab 8 and Lab 9 CI

on:
  push:
    branches:
      - main
      - master
      - experiment-3

  pull_request:
    branches:
      - main
      - master
      - experiment-3

  workflow_dispatch:

jobs:
  testing:
    name: Model Testing and Reliability Testing

    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements-ci.txt

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      # Step 4: Verify model artifacts
      - name: Verify Model Artifacts
        run: |
          python -c "import os; assert os.path.exists('models/final_svm_model.pkl'), 'Model file missing'; assert os.path.exists('models/tfidf_vectorizer.pkl'), 'Vectorizer file missing'; print('Model and vectorizer artifacts verified')"

      # Step 5: Run Lab 8 and Lab 9 automated tests
      - name: Run Lab 8 and Lab 9 Automated Tests
        run: |
          python -m pytest tests/test_model.py tests/test_failure_injection.py -v

      # Step 6: Execute Lab 9 failure injection
      - name: Run Lab 9 Failure Injection
        run: |
          python -m src.failure_injection

      # Step 7: Verify Lab 9 report
      - name: Verify Lab 9 Report
        run: |
          python -c "import json; r=json.load(open('artifacts/failure_injection_report.json')); assert r['overall_status']=='PASSED'; assert r['failed']==0; print('Lab 9 report verified successfully')"

      # Step 8: Upload test reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab8-lab9-test-reports
          path: |
            artifacts/failure_injection_report.json
            artifacts/reproducibility_report.json
          if-no-files-found: warn
