
name: Lab 8 - Fake and Real News CI Pipeline

on:
  push:
    branches: [ main, master, experiment-3 ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  model-testing:
    name: Automated Model Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install CI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Verify Model Artifacts
        run: |
          test -f models/final_svm_model.pkl
          test -f models/tfidf_vectorizer.pkl

      - name: Run Lab 8 and Lab 9 Automated Tests
  run: |
    python -m pytest tests/test_model.py tests/test_failure_injection.py -v

- name: Run Lab 9 Failure Injection
  run: |
    python -m src.failure_injection

- name: Verify Lab 9 Report
  run: |
    python -c "import json; r=json.load(open('artifacts/failure_injection_report.json')); assert r['overall_status']=='PASSED'; assert r['failed']==0; print('Lab 9 report verified successfully')"