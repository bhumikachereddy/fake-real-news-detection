
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-real-news-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fake-real-news
  template:
    metadata:
      labels:
        app: fake-real-news
    spec:
      containers:
        - name: fake-real-news-api
          image: fake-real-news-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
